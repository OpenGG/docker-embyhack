version: '3'

# silent: true

includes:
  variables: ./variables.yaml

tasks:
  edit:
    desc: "Step 4: Edit decompiled IL files and JavaScript, then recompile DLLs."
    vars:
      # Staging directory for intermediate editing and recompilation steps
      PATH_STAGING: "{{.PATH_OUTPUT}}.staging"
      PATH_STAGING_DLL: "{{.PATH_STAGING}}/dll"
      PATH_STAGING_IL: "{{.PATH_STAGING}}/il"
      PATH_STAGING_JS: "{{.PATH_STAGING}}/js"
    status:
      # Check if the final output directory exists to determine if the task needs to run
      - test -d {{.PATH_OUTPUT}}
    cmds:
      - echo "--- [Step 4] Editing and Recompiling Files ---"

      - |
          rm -rf {{.PATH_STAGING}}

          echo "Copying original JS files to staging area for editing..."
          {{.COMMAND_COPY_RECURSIVE}} {{.PATH_INPUT}}/ {{.PATH_STAGING}}/

      - |
        echo "Preprocessing IL files for modification..."
        # Iterate through all IL files and preprocess them
        for il_file in $(find {{.PATH_STAGING_IL}} -type f -name "*.il"); do
          echo "Preprocessing $il_file..."
          bash -c '. {{.NVM_SH}} && cd {{.PATH_NODE}} && pnpm run preprocess-il "$0" "$1"' "$il_file" "$il_file.PREPROCESSED"
          # Replace the original IL file with its preprocessed version
          mv "$il_file.PREPROCESSED" "$il_file"
        done

      - |
        echo "Editing IL files to apply modifications (e.g., URL replacements)..."
        # Find IL files containing "mb3admin" (target for modification) and edit them
        target_il_files=$(find {{.PATH_STAGING_IL}} -type f -exec grep -l "mb3admin" {} +)
        for target_file in $target_il_files; do
          echo "Editing $target_file..."
          bash -c '. {{.NVM_SH}} && cd {{.PATH_NODE}} && pnpm run edit "$0" "$1"' "$target_file" "$target_file.EDIT"
          # If an edited version is created, replace the original IL file
          if [ -f "$target_file.EDIT" ]; then mv "$target_file.EDIT" "$target_file"; fi
        done

      - |
        echo "Recompiling DLLs from modified IL files..."
        # Recompile each target DLL from its corresponding modified IL files
        for dll_file in {{.EMBY_TARGET_DLL}}; do
          echo "Recompiling $dll_file..."
          base_name=${dll_file%.dll}
          {{.COMMAND_COMPILE_DLL}} "{{.PATH_STAGING_IL}}/$base_name/$base_name.il" -out="{{.PATH_STAGING_DLL}}/$dll_file"
        done
        # Clean up the temporary IL editing directory

      - |
        echo "Editing JS files to apply modifications..."
        # Iterate through all JS files in the staging directory and edit them
        target_js_files=$(find {{.PATH_STAGING_JS}} -type f -name "*.js")
        for target_file in $target_js_files; do
          echo "Editing $target_file..."
          bash -c '. {{.NVM_SH}} && cd {{.PATH_NODE}} && pnpm run edit "$0" "$1"' "$target_file" "$target_file.EDIT"
          # If an edited version is created, replace the original JS file
          if [ -f "$target_file.EDIT" ]; then mv "$target_file.EDIT" "$target_file"; fi
        done

      # Move the completed staging directory to the final output directory
      - mv {{.PATH_STAGING}} {{.PATH_OUTPUT}}
      - echo "✅ Step 4 complete."
